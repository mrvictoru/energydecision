name: Deploy website to GitHub Pages

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - index.html
      - website-assets/**
      - paper/manuscript/draft_paper_NeurIPS_2026.pdf
      - paper/manuscript/figures/fig1_main_results.*
      - paper/manuscript/figures/fig5_revenue_decomposition.pdf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public website files
        run: |
          mkdir -p _site/website-assets _site/paper/manuscript/figures
          cp index.html _site/
          cp website-assets/rollout-viewer.js website-assets/dispatch-v2cal.json _site/website-assets/
          cp paper/manuscript/draft_paper_NeurIPS_2026.pdf _site/paper/manuscript/
          cp paper/manuscript/figures/fig1_main_results.{pdf,png} \
             paper/manuscript/figures/fig5_revenue_decomposition.pdf _site/paper/manuscript/figures/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
